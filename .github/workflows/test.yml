name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 拡張機能の読み込みには headless_shell ではなく完全な chromium ビルドが必要
      - run: npx playwright install --with-deps chromium

      - run: npm test
